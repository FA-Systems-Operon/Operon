# SonarCloud analyzes code for potential bugs, security issues, and maintainability problems.
# Codecov shows how much code is exercised by tests and how coverage changes in each pull request.
name: Build

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest

    # Throwaway Postgres for the backend tests (tests/conftest.py creates operon_test).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: operon_test
          POSTGRES_USER: operon
          POSTGRES_PASSWORD: operon_test_password
        ports:
          - 5432:5432
        # Don't start the steps until Postgres accepts connections.
        options: >-
          --health-cmd "pg_isready -U operon -d operon_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install test dependencies
        # Wheels only (no source builds), so no package setup scripts run in CI.
        # "run: |" keeps YAML from reading the ":all: " as a key/value pair.
        run: |
          python -m pip install --only-binary=:all: \
            -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Run Python tests with coverage
        env:
          TEST_DATABASE_URL: postgresql://operon:operon_test_password@localhost:5432/operon_test
        run: pytest tests --cov=backend/src --cov-branch --cov-report=xml

      - name: Run frontend tests with coverage
        working-directory: frontend
        run: npm ci && npm test

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  codecov:
    name: Codecov
    runs-on: ubuntu-latest

    # Throwaway Postgres for the backend tests (tests/conftest.py creates operon_test).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: operon_test
          POSTGRES_USER: operon
          POSTGRES_PASSWORD: operon_test_password
        ports:
          - 5432:5432
        # Don't start the steps until Postgres accepts connections.
        options: >-
          --health-cmd "pg_isready -U operon -d operon_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install test dependencies
        # Wheels only (no source builds), so no package setup scripts run in CI.
        # "run: |" keeps YAML from reading the ":all: " as a key/value pair.
        run: |
          python -m pip install --only-binary=:all: \
            -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Run Python tests with coverage
        env:
          TEST_DATABASE_URL: postgresql://operon:operon_test_password@localhost:5432/operon_test
        run: pytest tests --cov=backend/src --cov-branch --cov-report=xml

      - name: Run frontend tests with coverage
        working-directory: frontend
        run: npm ci && npm test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
