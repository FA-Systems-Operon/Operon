# Runs the tests against Postgres, then sends the coverage report to Codecov and SonarCloud.
# SonarCloud analyzes code for potential bugs, security issues, and maintainability problems.
# Codecov shows how much code is exercised by tests and how coverage changes in each pull request.
name: Build

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  # One job, so the Sonar scan can read the coverage.xml the tests just produced.
  test-and-analyze:
    name: Tests, Codecov, and SonarQube
    runs-on: ubuntu-latest

    # Throwaway Postgres for the tests, same version as compose.yaml.
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: operon_test
          POSTGRES_USER: operon_user
          POSTGRES_PASSWORD: operon_test_password
        ports:
          - 5432:5432
        # Don't start the steps until Postgres accepts connections.
        options: >-
          --health-cmd "pg_isready -U operon_user -d operon_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Full history, so Sonar can tell which code is new in this PR.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        # Wheels only (no source builds), so no package setup scripts run in CI.
        # "run: |" keeps YAML from reading the ":all: " as a key/value pair.
        run: |
          python -m pip install --only-binary=:all: \
            -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Run tests with coverage
        env:
          TEST_DATABASE_URL: postgresql://operon_user:operon_test_password@localhost:5432/operon_test
        run: pytest --cov --cov-branch --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      # Runs last: reads coverage.xml (path set in sonar-project.properties).
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
