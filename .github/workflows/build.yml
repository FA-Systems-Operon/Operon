# SonarCloud analyzes code for potential bugs, security issues, and maintainability problems.
# Codecov shows how much code is exercised by tests and how coverage changes in each pull request.
name: Build

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarqube:
    name: SonarQube
    needs: [codecov, frontend]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v5
        with:
          name: python-coverage
          path: .

      - name: Download frontend coverage report
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: frontend-coverage
          path: frontend/coverage

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  codecov:
    name: Codecov
    runs-on: ubuntu-latest

    # Throwaway Postgres for the tests, same version as compose.yaml.vscode-webview://0gf0k2o1pgdp39or2mm3a884l3m7vhhvjbidoftr741bia33us6k/.github/workflows/build.yml
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: operon_test
          POSTGRES_USER: operon_user
          POSTGRES_PASSWORD: operon_test_password
        ports:
          - 5432:5432
        # Don't start the steps until Postgres accepts connections.
        options: >-
          --health-cmd "pg_isready -U operon_user -d operon_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        # Hashed lock of requirements.txt + requirements-dev.txt (see backend/README.md).
        # Wheels only (no source builds), so no package setup scripts run in CI.
        # "run: |" keeps YAML from reading the ":all: " as a key/value pair.
        run: |
          python -m pip install --require-hashes --only-binary=:all: \
            -r backend/requirements-dev.lock

      - name: Run tests with coverage
        env:
          TEST_DATABASE_URL: postgresql://operon_user:operon_test_password@localhost:5432/operon_test
        run: pytest --cov --cov-branch --cov-report=xml

      - name: Save coverage report for SonarQube
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: coverage.xml
          if-no-files-found: error

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24" # same major as frontend/Dockerfile

      - name: Install dependencies
        # Lockfile only, no package install scripts (same as Dockerfile.prod).
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Run tests with coverage
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Save coverage report for SonarQube
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          if-no-files-found: error
