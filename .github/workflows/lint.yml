# Ruff linting finds common Python coding errors, such as unused imports and undefined variables.
# Ruff formatting checks that Python files follow a consistent style without modifying them.
name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and formatting
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Ruff
        run: |
          python -m pip install --only-binary=:all: "ruff==0.16.9"

      - name: Check lint
        run: ruff check --output-format=github .

      - name: Check formatting
        run: ruff format --check .
