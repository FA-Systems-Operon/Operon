sonar.projectKey=FA-Systems-Operon_Operon
sonar.organization=fa-systems-operon


# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=SOEN-490
#sonar.projectVersion=1.0


# Paths are relative to this file. Replace "\" by "/" on Windows.
sonar.sources=backend/src,frontend/src
sonar.tests=tests

# Python: coverage report written by "pytest --cov --cov-report=xml" in build.yml,
# and the version the backend runs on (backend/Dockerfile).
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.version=3.11

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8
