services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-operon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-operon}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-operon} -d ${POSTGRES_DB:-operon}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    command: ["fastapi", "dev", "src/main.py", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-operon}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-operon}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      STORAGE_DIR: /code/storage
      MAX_UPLOAD_BYTES: "20971520"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/src:/code/src
      # Keeps uploaded documents when the container is rebuilt or restarted.
      - document_storage:/code/storage
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      API_URL: http://api:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  db_data:
  document_storage:
