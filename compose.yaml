version: '3.8'

services:
  # Frontend: React + TypeScript application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: operon_frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_BASE_URL: http://localhost:8080/api
    depends_on:
      - backend
    networks:
      - operon_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Backend: FastAPI Python application
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: operon_backend
    ports:
      - "8080:8080"
    environment:
      # Python
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      
      # Application
      DEBUG: "true"
      LOG_LEVEL: "DEBUG"
      ENV: "development"
      
      # AI Provider Configuration
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL_NAME: ${OLLAMA_MODEL_NAME:-llama2}
      
      # Cloud Provider Fallback (for switching providers)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      
      # Database
      DATABASE_URL: postgresql://operon_user:[REDACTED]@postgres:5432/operon_dev
      
      # Background Job Configuration
      BACKGROUND_WORKER_ENABLED: "true"
      MAX_CONCURRENT_JOBS: "3"
      JOB_TIMEOUT_SECONDS: "300"
      JOB_RETRY_ATTEMPTS: "3"
      
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    volumes:
      # Mount source code for development (enables code changes without rebuild)
      - ./backend/src:/app/src
      # Mount alembic migrations
      - ./backend/alembic:/app/alembic
    networks:
      - operon_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # PostgreSQL Database
  postgres:
    image: postgres:17-alpine
    container_name: operon_postgres
    environment:
      POSTGRES_DB: operon_dev
      POSTGRES_USER: operon_user
      POSTGRES_PASSWORD: operon_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - operon_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U operon_user -d operon_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Ollama - Local AI Model Service
  ollama:
    image: ollama/ollama:latest
    container_name: operon_ollama
    ports:
      - "11434:11434"
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - operon_network
    # Optional: GPU acceleration (uncomment if you have NVIDIA GPU)
    # runtime: nvidia
    # environment:
    #   CUDA_VISIBLE_DEVICES: "0"

volumes:
  postgres_data:
    driver: local
  ollama_data:
    driver: local

networks:
  operon_network:
    driver: bridge
