services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: operon_backend
    ports:
      - "8080:8080"
    environment:
      DEBUG: "true"
      AI_PROVIDER: "ollama"
      OLLAMA_BASE_URL: "http://ollama:11434"
    networks:
      - operon_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: operon_frontend
    ports:
      - "3000:3000"
    networks:
      - operon_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3

  ollama:
    image: ollama/ollama:latest
    container_name: operon_ollama
    ports:
      - "11434:11434"
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - operon_network

volumes:
  ollama_data:
    driver: local

networks:
  operon_network:
    driver: bridge
