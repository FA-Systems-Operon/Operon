services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: operon_backend
    # Dev only: the Dockerfile binds to 127.0.0.1, which is unreachable from
    # outside the container. 0.0.0.0 lets the "8080:8080" port mapping work.
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "8080:8080"
    environment:
      DEBUG: "true"
      AI_PROVIDER: "ollama"
      OLLAMA_BASE_URL: "http://ollama:11434"
      DATABASE_URL: "postgresql://operon_user:${POSTGRES_PASSWORD:-operon_dev_password}@postgres:5432/operon_dev"
      STORAGE_DIR: "/app/storage"
      MAX_UPLOAD_BYTES: "20971520"
    volumes:
      # Keeps uploaded documents when the container is rebuilt or restarted.
      - document_storage:/app/storage
    depends_on:
      # Wait until Postgres accepts connections; the app creates tables at startup.
      postgres:
        condition: service_healthy
    networks:
      - operon_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: operon_frontend
    ports:
      - "3000:3000"
    networks:
      - operon_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:17.11-alpine
    container_name: operon_postgres
    environment:
      POSTGRES_DB: operon_dev
      POSTGRES_USER: operon_user
      # Local dev only. Override it in .env; prod uses DB_PASSWORD (compose.prod.yaml).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-operon_dev_password}
    # Published so pytest and DB tools on your machine can reach it at localhost:5432.
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - operon_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U operon_user -d operon_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: operon_ollama
    ports:
      - "11434:11434"
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - operon_network

volumes:
  postgres_data:
    driver: local
  document_storage:
    driver: local
  ollama_data:
    driver: local

networks:
  operon_network:
    driver: bridge
