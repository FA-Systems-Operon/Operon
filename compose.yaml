services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: operon
      POSTGRES_PASSWORD: operon
      POSTGRES_DB: operon
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U operon -d operon"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    command: ["fastapi", "dev", "src/main.py", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://operon:operon@db:5432/operon
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/src:/code/src
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      API_URL: http://api:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  db_data:
